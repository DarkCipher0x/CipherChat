# gitleaks rules for CipherChat's public output: gitleaks' own rules plus this project's secret formats.
title = "CipherChat"

[extend]
useDefault = true

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL"
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d+/[\w-]+'''
keywords = ["discord"]

[[rules]]
id = "github-token"
description = "GitHub token (classic, OAuth, app or fine-grained)"
regex = '''\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_"]

[[rules]]
id = "login-at-ip"
description = "A user@IPv4 login, as used for deploy targets"
regex = '''\b[a-z_][a-z0-9_-]{1,31}@(?:\d{1,3}\.){3}\d{1,3}\b'''

[[rules]]
id = "cipherchat-connector-code"
description = "A CipherChat add-on connector code (carries a 256-bit request key)"
regex = '''\bccaddon1\.[A-Za-z0-9_-]{40,}'''
keywords = ["ccaddon1."]

[[rules]]
id = "cipherchat-pairing-code"
description = "A CipherChat device pairing code (carries a device token)"
regex = '''cipherchat:pair/v1\?server=[^&\s]+&token=[A-Za-z0-9_-]{30,}'''
keywords = ["cipherchat:pair"]

# The cross-client crypto test vectors (docs/INTEROP.md) are throwaway keys generated by the tests themselves for the
# made-up people "alice" and "bob"; gitleaks' generic rule reads their base64 as API keys. Only these files are skipped.
[allowlist]
description = "synthetic interop test vectors"
paths = [
  '''(^|/)android/core/crypto/src/test/resources/interop/[a-z-]+\.json$''',
  '''(^|/)windows/tests/CipherChat\.Crypto\.Tests/interop/[a-z-]+\.json$''',
  '''(^|/)web/tests/fixtures/[a-z-]+\.json$''',
]
