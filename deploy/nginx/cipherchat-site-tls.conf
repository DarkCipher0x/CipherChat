
server {
    @LISTEN_TLS@
    server_name @DOMAIN@;

    ssl_certificate     @CERT@;
    ssl_certificate_key @KEY@;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve @CURVES@;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CipherChatSSL:10m;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;                                  # no client addresses in logs (docs/security/SECURITY-DESIGN.md)
    error_log /var/log/nginx/error.log crit;

    location = / { return 302 /chat/; }
    # Android passkeys: the server answers only when CIPHERCHAT_ANDROID_APPS is set (404 otherwise). A site of yours
    # that CipherChat was merged into needs this line itself if you want passkeys in the Android app (docs/ANDROID.md).
    location = /.well-known/assetlinks.json { limit_except GET { deny all; } include /etc/nginx/snippets/cipherchat-proxy.inc; }
    location / { return 404; }
    include /etc/nginx/snippets/cipherchat-locations.conf;
}
