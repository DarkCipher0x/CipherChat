# CipherChat by DarkCipher Systems: CipherChat's own nginx site for @DOMAIN@ (written by cipherchat-setup as
# /etc/nginx/sites-available/cipherchat.conf; re-running the setup rewrites it, so change the setup's choices instead).
#
# TLS 1.3 only with post-quantum hybrid key exchange first. X25519MLKEM768 needs nginx built against OpenSSL 3.5 or
# newer. The CipherChat apps refuse any connection that doesn't negotiate it; browsers that can't fall back to X25519.

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
@TLS_BLOCK@
