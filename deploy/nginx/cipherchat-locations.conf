# CipherChat by DarkCipher Systems: every CipherChat path, for one nginx server block (installed by cipherchat-setup as
# /etc/nginx/snippets/cipherchat-locations.conf and included by CipherChat's own site, or by a site of yours it was
# merged into). Everything is under /chat/, so it sits beside whatever else the site serves.
#
# ^~ keeps the site's own regex locations (static-file caching and the like) away from CipherChat's paths. The
# add_header below stops the site's own add_header lines (a different Content-Security-Policy, say) from being
# inherited here: the CipherChat server sets its own security headers on every response.

location = /chat { return 301 /chat/; }

location ^~ /chat/ {
    # no addresses in logs: CipherChat keeps no access log, and only critical errors (rate-limit and client errors
    # name the client's address, so they aren't written)
    access_log off;
    error_log /var/log/nginx/error.log crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 256k;
    client_body_timeout 30s;
    limit_conn cipherchat_conn 40;

    # Sign-in, device sign-in, re-auth, passkeys, invite links, access requests: a few per minute per address
    location ~ ^/chat/api/(auth/(login|device|reauth|password|enrol/(start|finish)|passkey/finish)|request)$ {
        limit_except POST { deny all; }
        limit_req zone=cipherchat_auth burst=4 nodelay;
        client_max_body_size 16k;
        include /etc/nginx/snippets/cipherchat-proxy.inc;
    }

    # Encrypted attachments: up to 100 MiB of ciphertext, buffered by nginx so a slow client never ties up the server
    location ^~ /chat/api/upload/ {
        limit_except POST { deny all; }
        limit_req zone=cipherchat_api burst=20 nodelay;
        client_max_body_size 105m;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/cipherchat-proxy.inc;
    }

    # Long polls hold up to 25 s; everything else answers at once
    location /chat/api/ {
        limit_req zone=cipherchat_api burst=40 nodelay;
        proxy_buffering off;
        proxy_read_timeout 40s;
        include /etc/nginx/snippets/cipherchat-proxy.inc;
    }

    # The web portal's pages and scripts
    location /chat/ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/cipherchat-proxy.inc;
    }
}
