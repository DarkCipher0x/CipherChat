# CipherChat by DarkCipher Systems: nginx http-level settings (installed by cipherchat-setup as
# /etc/nginx/conf.d/cipherchat.conf). Rate-limit zones and the upstream; every name starts with cipherchat_ so nothing
# clashes with your other sites.
limit_req_zone $binary_remote_addr zone=cipherchat_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=cipherchat_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cipherchat_conn:10m;

upstream cipherchat {
    server 127.0.0.1:@PORT@;
    keepalive 16;
}
