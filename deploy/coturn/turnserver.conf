# CipherChat by DarkCipher Systems: coturn, the relay for calls behind NAT (written by cipherchat-setup as
# /etc/turnserver.conf; your previous file, if any, is kept in /var/lib/cipherchat-setup and put back on uninstall).
# It only ever relays frames that are already end-to-end encrypted (docs/CALLS.md).

listening-port=3478
tls-listening-port=5349
min-port=@MIN_PORT@
max-port=@MAX_PORT@
realm=@DOMAIN@
server-name=@DOMAIN@
fingerprint

# Credentials: short-lived, made by the CipherChat server from this shared secret (calls.py)
use-auth-secret
static-auth-secret=@SECRET@

cert=/etc/coturn/certs/cipherchat.crt
pkey=/etc/coturn/certs/cipherchat.key
no-tlsv1
no-tlsv1_1

# Never a way into this server's own networks: private, loopback, link-local, carrier-grade NAT and multicast peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-multicast-peers

# Limits: a few relays per person, a ceiling for the whole server
user-quota=12
total-quota=400
stale-nonce=600
no-cli
no-stdout-log
log-file=/dev/null

